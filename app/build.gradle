plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.alwaysnearby.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.alwaysnearby.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    dependencies {
        implementation 'com.google.mlkit:text-recognition:16.0.1'
    }
}
