plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.alwaysnearby.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.alwaysnearby.app'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '0.6.0'
    }
}

dependencies {
    implementation 'com.rmtheis:tess-two:9.1.0'
}


// Download Tesseract language data during CI build and package it inside the APK.
tasks.register('downloadTessdata') {
    def assetDir = file('src/main/assets/tessdata')
    outputs.files(fileTree(assetDir) { include '*.traineddata' })
    doLast {
        assetDir.mkdirs()
        ['rus', 'eng'].each { lang ->
            def target = new File(assetDir, lang + '.traineddata')
            if (!target.exists() || target.length() < 1000000) {
                def temp = new File(assetDir, lang + '.traineddata.tmp')
                new URL("https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/" + lang + ".traineddata").withInputStream { input ->
                    temp.withOutputStream { output -> output << input }
                }
                if (temp.length() < 1000000) {
                    temp.delete()
                    throw new GradleException("Invalid Tesseract model: " + lang)
                }
                if (target.exists()) target.delete()
                if (!temp.renameTo(target)) throw new GradleException("Cannot install Tesseract model: " + lang)
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn tasks.named('downloadTessdata') }
